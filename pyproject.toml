[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix"
version = "0.0.1"
description = "TraceFix - graph-native bug-resolution agent. Workstream A: repository intelligence, FalkorDB graph, retrieval, and context packages."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies approved at Checkpoint 0 (D3, D6): pydantic for contract
# models, rank_bm25 for the lexical baseline, falkordb for the graph client.
# Justification: docs/workstreams/graph-retrieval-audit.md section 4.
dependencies = [
    "pydantic>=2.0",
    "rank_bm25>=0.2",
    "falkordb>=1.0",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "mcp>=1.2.0",
]

[project.scripts]
tracefix-mcp = "tracefix.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.0",
]
# Optional exact tokenizer (Checkpoint 0 D4). CharDiv4TokenCounter is the
# dependency-free default; install this extra to enable TiktokenTokenCounter.
tiktoken = [
    "tiktoken>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -m 'not integration and not slow' --ignore=tests/fixtures"
markers = [
    "contract: validates serialized objects and contract files against contracts/",
    "integration: requires a running service (FalkorDB/Docker); excluded from the default run",
    "slow: long-running; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["falkordb.*", "rank_bm25.*", "tiktoken.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
